# Starts PostgreSQL only. Run the API directly with uvicorn (see README).
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ams}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ams}
      POSTGRES_DB: ${POSTGRES_DB:-ams}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ams}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Uncomment later to run the API in Docker too
  # backend:
  #   build: ./backend
  #   env_file: .env
  #   environment:
  #     DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ams}:${POSTGRES_PASSWORD:-ams}@db:5432/${POSTGRES_DB:-ams}
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #   ports:
  #     - "8000:8000"

volumes:
  pgdata:
